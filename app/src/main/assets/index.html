<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoGa</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--text:#e6e9ef;--dim:#8b93a5;--ac:#4f8cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);
font:14px/1.5 system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--panel);
border-bottom:1px solid var(--line)}h1{font-size:15px;margin:0;color:var(--ac)}
#chat{flex:1;overflow-y:auto;padding:12px}.msg{max-width:800px;margin:0 auto 10px}
.u .b{background:#1d2b45;border-radius:10px;padding:9px 12px;display:inline-block;white-space:pre-wrap}
.a .who{color:var(--ac);font-size:11px;text-transform:uppercase;margin-bottom:3px}
.a .b{white-space:pre-wrap}.err .b{color:#e0555f}.tl{color:var(--dim);font:12px monospace;
max-width:800px;margin:0 auto 6px}.acts{margin-top:6px;display:flex;gap:8px}
.acts button{background:var(--panel);color:var(--dim);border:1px solid var(--line);
border-radius:6px;padding:3px 10px;font-size:12px}
#bar{display:flex;gap:8px;padding:10px;background:var(--panel);border-top:1px solid var(--line)}
#msg{flex:1;resize:none;background:var(--bg);color:var(--text);border:1px solid var(--line);
border-radius:8px;padding:10px;height:56px;font-size:16px}
#mic,#send{border:0;border-radius:8px;padding:0 14px;font-size:16px}
#mic{background:var(--panel);color:var(--text);border:1px solid var(--line)}
#send{background:var(--ac);color:#fff}.st{max-width:800px;margin:0 auto;color:var(--dim);font-size:12px;padding:2px}
#settings{position:fixed;inset:0;background:var(--bg);z-index:9;display:none;
flex-direction:column;padding:24px 20px}
#settings h2{color:var(--ac);margin:0 0 18px}#settings label{display:block;
color:var(--dim);font-size:12px;margin:14px 0 4px}
#settings select,#settings input{width:100%;background:var(--panel);color:var(--text);
border:1px solid var(--line);border-radius:8px;padding:12px;font-size:15px}
#settings textarea{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);
border-radius:8px;padding:12px;font-size:15px;min-height:96px}
.presets{display:flex;gap:8px;margin-top:6px}
.presets button{flex:1;background:var(--panel);color:var(--dim);border:1px solid var(--line);
border-radius:6px;padding:7px;font-size:12px}
#ok{margin-top:26px;background:var(--ac);color:#fff;border:0;border-radius:8px;
padding:14px;font-size:16px}
</style></head><body>
<div id="settings">
  <h2>MoGa settings</h2>
  <label>Provider</label><select id="prov"></select>
  <label>Model (blank = provider default)</label><input id="model">
  <label>API key (not needed for Custom)</label><input id="key" type="password">
  <label>Custom server URL - Custom provider only</label>
  <input id="base" placeholder="http://192.168.1.10:1234/v1">
  <label>System prompt</label><textarea id="sys"></textarea>
  <div class="presets"><button id="pAgent" type="button">MoGa agent</button>
  <button id="pTutor" type="button">EduQwen tutor</button></div>
  <div id="smsg" style="color:var(--dim);font-size:12px;margin-top:10px"></div>
  <button id="ok">OK — save and start chatting</button>
</div>
<header><h1>MoGa</h1><div style="flex:1"></div>
<select id="tlang"><option value="English">EN</option><option value="Chinese (Simplified)">中文</option>
<option value="Hindi">हिं</option><option value="Arabic">عربي</option><option value="Spanish">ES</option></select>
<button id="gear" style="background:var(--panel);color:var(--text);border:1px solid var(--line);
border-radius:6px;padding:4px 10px">⚙</button></header>
<div id="chat"></div><div id="st"></div>
<div id="bar"><button id="mic">🎙</button>
<textarea id="msg" placeholder="Talk or type a task... e.g. set an alarm for 7am"></textarea>
<button id="send">Send</button></div>
<script>
const $=id=>document.getElementById(id);
const SYS="You are MoGa, a helpful assistant on the user's phone. Be concise. You can act on the phone with tools: use setAlarm/setTimer for wake-ups and countdowns (24h clock), notify for on-screen reminders, sendSms to text someone (ask for the number if unknown), openUrl to open websites, deviceInfo for battery/time/model. After using tools, confirm what you did in plain words.";
const EDU="You are EduQwen, a patient expert tutor for learners of every age, subject, curriculum and language. You adapt depth, vocabulary and examples to the learner's stated level and curriculum. You explain step by step, check understanding with a short question at the end, and never invent facts. If the learner asks in a language other than English, you answer in that language.";
const chat=$('chat'),st=$('st'),msg=$('msg');
let msgs=JSON.parse(localStorage.moga_msgs||'[]'),cur=null;
$('key').value=localStorage.moga_key||'';
$('model').value=localStorage.moga_model||'';
$('base').value=localStorage.moga_base||'';
$('sys').value=localStorage.moga_sys||SYS;
$('pAgent').onclick=()=>{$('sys').value=SYS};
$('pTutor').onclick=()=>{$('sys').value=EDU};
function openSettings(){$('settings').style.display='flex';$('smsg').textContent='';}
function closeSettings(){
 const prov=$('prov').value;
 if(prov!='custom' && !$('key').value.trim()){$('smsg').textContent='An API key is required.';return}
 if(prov=='custom'){
  if(!$('base').value.trim()){$('smsg').textContent='Custom provider needs the server URL (e.g. http://192.168.1.10:1234/v1).';return}
  if(!$('model').value.trim()){$('smsg').textContent='Custom provider needs the model name as shown in LM Studio / Ollama.';return}}
 localStorage.moga_key=$('key').value.trim();
 localStorage.moga_model=$('model').value.trim();
 localStorage.moga_base=$('base').value.trim();
 localStorage.moga_sys=$('sys').value;
 localStorage.moga_prov=prov;
 $('settings').style.display='none';}
$('ok').onclick=closeSettings;$('gear').onclick=openSettings;
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function scroll(){chat.scrollTop=chat.scrollHeight}
function render(){chat.innerHTML='';for(const m of msgs){
 if(m.r=='u'){const d=el('div','msg u');d.appendChild(el('div','b',m.t));chat.appendChild(d)}
 else{const d=el('div','msg a'+(m.t.startsWith('Error')?' err':''));
  d.appendChild(el('div','who','moga'));d.appendChild(el('div','b',m.t));
  if(m.acts)d.appendChild(m.acts);chat.appendChild(d)}}scroll()}
function acts(t){const r=el('div','acts'),s=el('button',null,'🔊 read'),tr=el('button',null,'🌐 translate');
 s.onclick=()=>{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))};
 tr.onclick=()=>{msg.value='Translate the previous answer into '+tlang.value+'. Reply with ONLY the translation.';send()};
 r.append(s,tr);return r}
const TOOLS=[
 {type:'function',function:{name:'setAlarm',description:'Set a wake-up alarm on the phone. Fires a loud notification.',parameters:{type:'object',properties:{hour:{type:'integer'},minute:{type:'integer'},label:{type:'string'}},required:['hour','minute']}}},
 {type:'function',function:{name:'setTimer',description:'Start a countdown timer that rings when done.',parameters:{type:'object',properties:{seconds:{type:'integer'},label:{type:'string'}},required:['seconds']}}},
 {type:'function',function:{name:'notify',description:'Show an on-screen reminder notification now.',parameters:{type:'object',properties:{title:{type:'string'},text:{type:'string'}},required:['title','text']}}},
 {type:'function',function:{name:'sendSms',description:'Send an SMS text message to a phone number.',parameters:{type:'object',properties:{number:{type:'string'},text:{type:'string'}},required:['number','text']}}},
 {type:'function',function:{name:'openUrl',description:'Open a website in the browser.',parameters:{type:'object',properties:{url:{type:'string'}},required:['url']}}},
 {type:'function',function:{name:'deviceInfo',description:'Get battery level, model, android version and current time.',parameters:{type:'object',properties:{}}}}
];
function runTool(name,a){
 try{switch(name){
  case 'setAlarm':return MoGaActions.setAlarm(a.hour|0,a.minute|0,a.label||'');
  case 'setTimer':return MoGaActions.setTimer(a.seconds|0,a.label||'');
  case 'notify':return MoGaActions.notify(a.title||'MoGa',a.text||'');
  case 'sendSms':return MoGaActions.sendSms(a.number||'',a.text||'');
  case 'openUrl':return MoGaActions.openUrl(a.url||'');
  case 'deviceInfo':return MoGaActions.deviceInfo();
  default:return 'Error: unknown action '+name;
 }}catch(e){return 'Error running '+name+': '+e+' (permission may be missing)'}
}
let busy=false;
async function send(){
 const text=msg.value.trim();
 if(!text||busy)return;
 const prov=localStorage.moga_prov;
 if(!localStorage.moga_key && prov!='custom'){openSettings();return}
 if(prov=='custom' && (!localStorage.moga_base||!localStorage.moga_model)){
  openSettings();$('smsg').textContent='Custom provider needs server URL and model name.';return}
 busy=true;msg.value='';st.textContent='thinking…';
 msgs.push({r:'u',t:text});render();
 const hist=msgs.filter(m=>!m.t.startsWith('Error')).slice(-8).map(m=>({role:m.r=='u'?'user':'assistant',content:m.t}));
 const api=[{role:'system',content:localStorage.moga_sys||SYS}].concat(hist);
 let out=null;
 try{
  for(let loop=0;loop<5;loop++){
   const r=await fetch('/api/llm',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({provider:prov,model:localStorage.moga_model,
     key:localStorage.moga_key,messages:api,base:localStorage.moga_base||'',
     tools:prov=='custom'?[]:TOOLS})});
   const d=await r.json();
   if(!d.choices){out='Error '+r.status+': '+(d.error?(d.error.message||JSON.stringify(d.error)).slice(0,200):'bad response')+' - check gear settings';break}
   const m=d.choices[0].message;
   if(!m.tool_calls||!m.tool_calls.length){out=(m.content||'');
    if(prov=='custom')out=out.replace(/^\s*<\/think>\s*/i,'');break}
   api.push({role:'assistant',content:m.content||null,tool_calls:m.tool_calls});
   for(const tc of m.tool_calls){
    const name=tc.function.name;let a={};
    try{a=JSON.parse(tc.function.arguments||'{}')}catch(e){}
    st.textContent='doing: '+name;
    chat.appendChild(el('div','tl','[action] '+name+' '+tc.function.arguments.slice(0,100)));scroll();
    const res=runTool(name,a);
    chat.appendChild(el('div','tl','[result] '+res.slice(0,120)));scroll();
    api.push({role:'tool',tool_call_id:tc.id,content:res});
   }
  }
 }catch(e){out='Error: '+e+' (check internet, then retry)'}
 if(out===null)out='(stopped after several actions)';
 msgs.push({r:'a',t:out,acts:acts(out)});render();
 st.textContent='';busy=false;
 localStorage.moga_msgs=JSON.stringify(msgs);
}
document.getElementById('send').onclick=()=>send();
msg.addEventListener('keydown',e=>{if(e.key=='Enter'&&!e.shiftKey){e.preventDefault();send()}});
let rec=null,listening=false;
window.moGaSpeechResult=function(t){
 if(!t)return;
 if(t.indexOf('__error__')===0){listening=false;mic.textContent='🎙';st.textContent=t.slice(9);return}
 if(t==='__listening__'){listening=true;mic.textContent='⏺';st.textContent='listening... speak now';return}
 msg.value=t;listening=false;mic.textContent='🎙';st.textContent='';};
mic.onclick=()=>{
 if(listening){if(window.MoGaSpeech)MoGaSpeech.stop();else if(rec)rec.stop();
  listening=false;mic.textContent='🎙';st.textContent='';return}
 if(window.MoGaSpeech){MoGaSpeech.start();return}
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){st.textContent='voice input not supported';return}
 rec=new SR();
 rec.lang=tlang.value.startsWith('Chinese')?'zh-CN':tlang.value=='Hindi'?'hi-IN':tlang.value=='Arabic'?'ar-SA':tlang.value=='Spanish'?'es-ES':'en-US';
 rec.interimResults=true;rec.onresult=e=>{let t='';for(const r of e.results)t+=r[0].transcript;msg.value=t};
 rec.onend=rec.onerror=()=>{listening=false;mic.textContent='🎙'};rec.start();listening=true;mic.textContent='⏺'};
fetch('/api/providers').then(r=>r.json()).then(l=>{
 const s=$('prov');l.forEach(p=>{const o=document.createElement('option');
  o.value=p.id;o.textContent=p.id;s.appendChild(o)});
 s.value=localStorage.moga_prov||'bigmodel';
 const ph=()=>{$('model').placeholder=s.value=='custom'
  ?'required - model name in LM Studio / Ollama'
  :'default: '+l.find(x=>x.id==s.value).model};
 ph();s.onchange=ph;
 if(!localStorage.moga_key)openSettings();});
render();
</script></body></html>
